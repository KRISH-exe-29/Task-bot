name: Daily activity

# Makes 0-4 commits a day as KRISH-exe-29. GitHub credits commits by author email,
# so the built-in token is enough. Skips about 1 day in 5 so the graph looks natural.
on:
  schedule:
    - cron: "17 10 * * *" # 15:47 India time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Commit
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ $((RANDOM % 5)) -eq 0 ]; then
            echo "Rest day."; exit 0
          fi
          git config user.name "Krishna Raju"
          git config user.email "100017249+KRISH-exe-29@users.noreply.github.com"
          n=$((RANDOM % 4 + 1))
          for i in $(seq "$n"); do
            echo "$(TZ=Asia/Kolkata date '+%F %T')" >> log.txt
            git add log.txt
            git commit -q -m "Log $(TZ=Asia/Kolkata date +%F) #$i"
          done
          git push
          echo "Made $n commits."
